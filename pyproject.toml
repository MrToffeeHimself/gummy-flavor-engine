[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gummy-flavor-engine"
version = "1.0.0"
description = "The official flavor selection engine for the Candy Kingdom's Flavor Forge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Mr. Toffee", email = "mr.toffee@king.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["flask==2.0.0"]

[project.urls]
Homepage = "https://github.com/MrToffeeHimself/gummy-flavor-engine"
